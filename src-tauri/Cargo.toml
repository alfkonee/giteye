[package]
name = "giteye"
version = "0.0.2"
description = "A cross-platform desktop Git client for repositories, worktrees, and pull request reviews."
authors = ["GitEye contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/alfkonee/giteye"
homepage = "https://github.com/alfkonee/giteye"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "giteye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
directories = "6"
cap-std = "4"
cap-fs-ext = "4"
cap-tempfile = "4"
tauri-plugin-mcp-bridge = "0.13.0"
notify = "8"
reqwest = { version = "0.13", features = ["blocking", "json"] }
flate2 = "1"
bzip2 = "0.6"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.11"
fs2 = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
