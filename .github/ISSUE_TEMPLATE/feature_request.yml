name: Feature request
description: Suggest an improvement to GitEye
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user problem should GitEye improve? Describe the problem before proposing UI or implementation details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the user be able to do, and what should GitEye display or preserve?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How do you handle this today? Include other approaches or Git tools considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, platform constraints, or related issues.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and pull requests for this request.
          required: true
        - label: This request describes one focused problem.
          required: true
